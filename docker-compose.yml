services:
    api:
        build: .
        container_name: go-api
        ports:
            - "8080:8080"
        environment:
            - DB_HOST=database
            - DB_PORT=5432
            - DB_USER=${DB_USER}
            - DB_PASSWORD=${DB_PASSWORD}
            - DB_NAME=${DB_NAME}
        depends_on:
            - database

    database:
        image: postgres:18
        container_name: postgres-db
        environment:
            - POSTGRES_DB=${DB_NAME}
            - POSTGRES_USER=${DB_USER}
            - POSTGRES_PASSWORD=${DB_PASSWORD}
        ports:
            - "${DB_PORT}:5432"
        volumes:
            - pgdata:/var/lib/postgresql
            - ./db/schema/schema.sql:/docker-entrypoint-initdb.d/schema.sql
volumes:
    pgdata: