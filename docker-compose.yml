services:
    api:
        build: .
        container_name: go-api
        ports:
            - "8080:8080"
        environment:
            - DB_HOST=database
            - DB_PORT=5432
            - DB_USER=ChiaraGian
            - DB_PASSWORD=ChiaraGian
            - DB_NAME=DB_PredictOne
        depends_on:
            - database

        volumes:
            - ./api:/app
    database:
        image: postgres:18
        container_name: postgres-db
        environment:
            - POSTGRES_DB=DB_PredictOne
            - POSTGRES_USER=ChiaraGian
            - POSTGRES_PASSWORD=ChiaraGian
        ports:
            - "5432:5432"
        volumes:
            - pgdata:/var/lib/postgresql
volumes:
    pgdata: