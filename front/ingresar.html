<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | PredictOne</title>
    <link rel="stylesheet" href="principal.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Predict<span>One</span></a>
        <nav class="nav-auth">
            <a href="registrar.html" class="btn-register">Registrarse</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Iniciar <span>Sesión</span></h2>
            <p class="auth-subtitle">Ingresá tus credenciales para acceder a tu cuenta.</p>

            <form class="auth-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre de Usuario</label>
                    <input type="text" id="nombre" name="nombre" placeholder="nombredeusuario" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Ingresar</button>
            </form>

            <p class="auth-footer-text">
                ¿No tenés una cuenta? <a href="registrar.html">Registrate acá</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <a href="/" class="logo">Predict<span>One</span></a>
        <p>LA FÓRMULA 1, MÁS CERCA DE VOS</p>
    </footer>

</body>
</html>
