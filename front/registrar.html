<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | PredictOne</title>
    <link rel="stylesheet" href="principal.css">
</head>
<body>

    <header class="navbar">
        <a href="index.html" class="logo">Predict<span>One</span></a>
        <nav class="nav-auth">
            <a href="ingresar.html" class="btn-login">Iniciar sesión</a>
        </nav>
    </header>

    <main class="auth-container">
        <div class="auth-box">
            <h2>Crear <span>Cuenta</span></h2>
            <p class="auth-subtitle">Sumate a PredictOne y viví la velocidad.</p>

            <form class="auth-form" action="#" method="POST">
                <div class="form-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit">Registrarse</button>
            </form>

            <p class="auth-footer-text">
                ¿Ya tenés cuenta? <a href="ingresar.html">Iniciá sesión</a>
            </p>
        </div>
    </main>

    <footer class="footer">
        <a href="/" class="logo">Predict<span>One</span></a>
        <p>LA FÓRMULA 1, MÁS CERCA DE VOS</p>
    </footer>

</body>
</html>
